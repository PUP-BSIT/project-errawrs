<!-- User Detail Card (hidden by default) -->
<div id="user_detail_card" style="display:none;">
  <button id="user_detail_back" class="btn btn-secondary">Back</button>
  <div class="user-detail-fields">
    <div><strong>User ID:</strong> <span id="ud_user_id"></span></div>
    <div><strong>Username:</strong> <span id="ud_username"></span></div>
    <div><strong>First Name:</strong> <span id="ud_first_name"></span></div>
    <div><strong>Last Name:</strong> <span id="ud_last_name"></span></div>
    <div><strong>Phone:</strong> <span id="ud_phone_number"></span></div>
    <div><strong>Date of Birth:</strong> <span id="ud_date_of_birth"></span></div>
    <div><strong>Nationality:</strong> <span id="ud_nationality"></span></div>
    <div><strong>Street:</strong> <span id="ud_street"></span></div>
    <div><strong>City:</strong> <span id="ud_city"></span></div>
    <div><strong>Zip Code:</strong> <span id="ud_zip_code"></span></div>
    <div><strong>Country:</strong> <span id="ud_country"></span></div>
    <div><strong>Email:</strong> <span id="ud_email"></span></div>
    <div><strong>ID Type:</strong> <span id="ud_id_type"></span></div>
    <div><strong>Created At:</strong> <span id="ud_created_at"></span></div>
    <div><strong>ID Image:</strong> <span id="ud_id_image"></span></div>
  </div>
</div>

<!-- Modal for ID image -->
<div id="idImageModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; z-index:1000;">
  <span id="idImageModalClose" style="position:absolute; top:20px; right:40px; color:#fff; font-size:2em; cursor:pointer;">&times;</span>
  <img id="idImageModalImg" src="" alt="ID Image" style="max-width:90vw; max-height:80vh; margin:auto; display:block;" />
</div>
