<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller History</title>
    <link 
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" 
        rel="stylesheet">
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/teller/css/bank_teller_history.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>
                    <span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <a href="/profile">
                    <div class="user-avatar dynamic-avatar"></div>
                </a>
                <!-- Removed the username display here -->
            </div>
            
            <div class="nav-menu">
                <a href="/dashboard" class="nav-item">
                    Dashboard
                </a>
                <a href="/search" class="nav-item">
                    Search Account
                </a>
                <a href="/deposit" class="nav-item">
                    Deposit
                </a>
                <a href="/withdraw" class="nav-item">
                    Withdraw
                </a>
                <a href="/registrations" class="nav-item">
                    Registration
                </a>
                <div class="nav-selected">Transaction</div>
            </div>

            <div class="nav-logout">
                <a href="/login" onclick="tellerLogout(); return false;">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="history-container">
                <h1>Transaction History</h1>

                <div class="table-container">
                    <div class="table-header">
                        <div class="header-row">
                            <div class="header-cell">DATE</div>
                            <div class="header-cell">TIME</div>
                            <div class="header-cell">ACCOUNT NUMBER</div>
                            <div class="header-cell">ACCOUNT NAME</div>
                            <div class="header-cell">ACCOUNT TYPE</div>
                            <div class="header-cell">AMOUNT</div>
                            <div class="header-cell">DETAILS</div>
                        </div>
                    </div>

                    <div id="table-body" class="table-body">
                        <!-- Table rows will be populated by JavaScript -->
                    </div>
                </div>

                <div class="pagination-container">
                    <div class="pagination-left">
                        <button id="prev-btn" class="pagination-btn" 
                                onclick="goToPreviousPage()">
                            Previous
                        </button>
                        <div id="page-numbers" class="page-numbers">
                            <!-- Page numbers will be populated by JavaScript -->
                        </div>
                        <button id="next-btn" class="pagination-btn" 
                                onclick="goToNextPage()">
                            Next
                        </button>
                    </div>
                    
                    <div class="pagination-right">
                        <div class="per-page-container">
                            <select id="per-page-select" class="per-page-select" 
                                    onchange="changeItemsPerPage()">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                            </select>
                            <span class="per-page-label">per page</span>
                        </div>
                        <div class="showing-container">
                            <span id="showing-text"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="notification_container" class="notification-container"></div>
    
    <script type="module" src="/teller/js/history.js"></script>
    <script type="module" src="/teller/js/logout.js"></script>
</body>
</html>
