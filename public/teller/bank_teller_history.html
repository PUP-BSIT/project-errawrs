<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller History</title>
    <link 
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" 
        rel="stylesheet">
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/bank_teller_history.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>
                    <span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <div class="user-avatar">
                    <div class="initials"></div>
                </div>
                <div class="user-name"></div>
            </div>
            
            <div class="nav-menu">
                <a href="bank_teller_dashboard.html" class="nav-item">Dashboard</a>
                <a href="bank_teller_search_account.html" class="nav-item">Search Account</a>
                <div class="nav-selected">History</div>
                <a href="bank_teller_profile.html" class="nav-item">Profile</a>
            </div>

            <div class="nav-logout">
                <a href="./bank_teller_login.html">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div id="notification_container" class="notification-container"></div>
                <div class="top-icons">
                    <div class="top-icon"><i class="fa-regular fa-bell"></i></div>
                    <div class="top-icon"><i class="fa-regular fa-square-plus"></i></div>
                </div>
            </div>

            <div class="history-container">
                <h1>Transaction History</h1>

                <div class="table-container">
                    <div class="table-header">
                        <div class="header-row">
                            <div class="header-cell">DATE</div>
                            <div class="header-cell">TIME</div>
                            <div class="header-cell">ACCOUNT NUMBER</div>
                            <div class="header-cell">ACCOUNT NAME</div>
                            <div class="header-cell">ACCOUNT TYPE</div>
                            <div class="header-cell amount-header">AMOUNT</div>
                            <div class="header-cell">DETAILS</div>
                        </div>
                    </div>

                    <div id="table-body" class="table-body">
                        <!-- Table rows will be populated by JavaScript -->
                    </div>
                </div>

                <div class="pagination-container">
                    <div class="pagination-left">
                        <button id="prev-btn" class="pagination-btn" onclick="goToPreviousPage()">Previous</button>
                        <div id="page-numbers" class="page-numbers">
                            <!-- Page numbers will be populated by JavaScript -->
                        </div>
                        <button id="next-btn" class="pagination-btn" onclick="goToNextPage()">Next</button>
                    </div>
                    
                    <div class="pagination-right">
                        <div class="per-page-container">
                            <select id="per-page-select" class="per-page-select" onchange="changeItemsPerPage()">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20">20</option>
                            </select>
                            <span class="per-page-label">per page</span>
                        </div>
                        <div class="showing-container">
                            <span id="showing-text"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/sidebar_nav.js"></script>
    <script src="./js/history.js"></script>
</body>
</html>
