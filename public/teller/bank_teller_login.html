<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>StackOvercash Login Teller</title>
        <link rel="stylesheet" href="./css/bank_teller_login.css"/>
        <link
              href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
              rel="stylesheet"/>
        <link 
              rel="stylesheet" 
              href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
    <body class="login-page">
        <div class="login-container">
            <div class="login-form-container">
                <div class="login-header-top">
                    <h1 class="login-logo">
                        Stack<span class="green">Overcash</span>
                    </h1>
                    <p class="welcome-text">Welcome !</p>
                </div>

                <form class="login-form" id="loginForm">
                    <div class="form-group">
                        <input
                            type="text"
                            placeholder="Teller Number"
                            class="login-input"
                            id="tellerNumber"
                            name="tellerNumber"
                            required/>
                    </div>

                    <div class="form-group">
                        <input
                            type="password"
                            placeholder="Password"
                            class="login-input"
                            id="passwordInput"
                            name="password"
                            required/>
                        <button type="button" class="password-toggle" 
                              onclick="togglePassword()">
                            <i class="fa-solid fa-eye-slash" id="toggleIcon">
                            </i>
                        </button>
                    </div>

                    <button type="submit" class="login-button">log in</button>

                    <div class="forgot-links">
                        <a href="#" class="forgot-link" 
                              onclick="handleForgotPassword()">Forgot password</a>
                    </div>
                </form>
            </div>
        </div>
        <script src="./js/teller_login.js"></script>
    </body>
</html>
