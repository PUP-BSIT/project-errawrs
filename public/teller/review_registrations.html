<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Registrations - Teller Dashboard</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/review_registrations.css">

    <!-- Session Check -->
    <script>
        // Check if teller is logged in
        if (!sessionStorage.getItem('tellerInfo')) {
            window.location.href = './bank_teller_login.html';
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h1>
                    <span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <a href="bank_teller_view_profile.html">
                    <div class="user-avatar">
                        <img src="../assets/images/profile_bank_teller.jpg" alt="Teller Profile">
                    </div>
                </a>
                <div class="user-name"></div>
            </div>
            
            <div class="nav-menu">
                <a href="bank_teller_dashboard.html" class="nav-item">Dashboard</a>
                <a href="bank_teller_search_account.html" class="nav-item">Search Account</a>
                <div class="nav-selected">Review Registrations</div>
                <a href="bank_teller_history.html" class="nav-item">History</a>
            </div>
            
            <div class="nav-logout">
                <a href="./bank_teller_login.html">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Page Header -->
            <div class="page-header">
                <h1>Review Registrations</h1>
                <p>Review and approve/deny pending user registrations</p>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <div class="filter-group">
                    <label for="status_filter">Status:</label>
                    <select id="status_filter" class="filter-select">
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="all">All</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="per-page-select">Show:</label>
                    <select id="per-page-select" class="filter-select">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                </div>
            </div>

            <!-- Applications Grid -->
            <div class="applications-grid">
                <!-- Registration cards will be dynamically inserted here -->
            </div>

            <!-- Pagination -->
            <div class="pagination-container">
                <div class="pagination-left">
                    <button id="prev-btn" class="pagination-btn" disabled>Previous</button>
                    <div id="page-numbers" class="page-numbers"></div>
                    <button id="next-btn" class="pagination-btn" disabled>Next</button>
                </div>
                <div id="showing-text" class="showing-text"></div>
            </div>

            <!-- Notification Container -->
            <div id="notification_container"></div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script>
        // Handle logout
        function handleLogout(e) {
            e.preventDefault();
            sessionStorage.removeItem('tellerInfo');
            window.location.href = './bank_teller_login.html';
        }

        // Update teller name
        document.addEventListener('DOMContentLoaded', () => {
            const tellerInfo = JSON.parse(sessionStorage.getItem('tellerInfo'));
            if (tellerInfo && tellerInfo.name) {
                document.querySelector('.user-name').textContent = tellerInfo.name;
            }
        });
    </script>
    <script src="js/review_registrations.js"></script>
</body>
</html>
