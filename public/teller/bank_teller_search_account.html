<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller Search Account</title>
    <link 
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" 
          rel="stylesheet">
    <link 
          rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/bank_teller_search_account.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1><span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <a href="bank_teller_view_profile.html">
                    <img src="../assets/images/profile_bank_teller.jpg"
                         alt="User Avatar" class="user-avatar">
                </a>
                <div class="user-name">Jovani Avi</div>
            </div>
            
            <div class="nav-menu">
                <a href="bank_teller_dashboard.html" class="nav-item">Dashboard</a>
                <div class="nav-selected">Search Account</div>
                <a href="bank_teller_history.html" class="nav-item">History</a>
            </div>

            <div class="nav-logout">
                <a href="./bank_teller_login.html">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" 
                           class="search-input" 
                           id="search_input"
                           placeholder="Search Account Number" 
                           onkeyup="searchAccount()">
                </div>
            </div>

            <div class="search-history">
                <h2>Search History</h2>
                <div class="history-table">
                    <div class="history-header">
                        <div class="header-cell">Number</div>
                        <div class="header-cell">Account Name</div>
                        <div class="header-cell">Account Number</div>
                    </div>
                    <div class="history-body" id="history_body"></div>
                </div>
            </div>

            <!-- Account Details (Initially Hidden) -->
            <div class="account-details" id="account_details">
                <div class="details-content">
                    <div class="detail-row">
                        <div class="detail-label">Account Number:</div>
                        <div class="detail-value" id="account_number"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Account Name:</div>
                        <div class="detail-value" id="account_name"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Account Type:</div>
                        <div class="detail-value" id="account_type"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Balance:</div>
                        <div class="detail-value" id="account_balance"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Status:</div>
                        <div class="detail-value" id="account_status"></div>
                    </div>
                </div>
                <div class="account-actions">
                    <button class="action-btn deposit-btn" onclick="showDepositForm()">
                        <i class="fas fa-plus"></i> Deposit
                    </button>
                    <button class="action-btn withdraw-btn" onclick="showWithdrawForm()">
                        <i class="fas fa-minus"></i> Withdraw
                    </button>
                    <button class="action-btn close-btn" onclick="closeAccount()">
                        <i class="fas fa-times"></i> Close Account
                    </button>
                    <button class="action-btn reopen-btn" onclick="reopenAccount()">
                        <i class="fas fa-redo"></i> Re-open Account
                    </button>
                </div>
            </div>

            <!-- Transaction Form Modal -->
            <div class="transaction-modal" id="transaction_form">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Transaction</h3>
                        <div class="current-balance">Current Balance: <span id="modal_balance"></span></div>
                    </div>
                    <div class="modal-body">
                        <div class="input-group">
                            <label for="transaction_amount">Amount</label>
                            <input type="number" 
                                   id="transaction_amount" 
                                   placeholder="Enter amount" 
                                   step="0.01" 
                                   min="0">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="modal-btn cancel" onclick="hideTransactionForm()">Cancel</button>
                        <button class="modal-btn confirm" onclick="processTransaction()">Confirm</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification_container" class="notification-container"></div>
    <script src="./js/search_account.js"></script>
</body>
</html>
