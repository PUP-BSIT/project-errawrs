<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/soc-logo.png" />
    <title>Bank Teller Search Account - StackOvercash</title>
    
    <!-- External Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/teller/css/bank_teller_search_account.css">
</head>
<body>
    <!-- Main Container -->
    <div class="container">
        <div class="sidebar">
            <!-- Logo Section -->
            <div class="logo">
                <h1>
                    <span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <!-- User Profile Section -->
            <div class="user-profile">
                <a href="/profile">
                    <div class="user-avatar dynamic-avatar"></div>
                </a>
                <!-- Removed the username display here -->
            </div>
            
            <!-- Navigation Menu -->
            <div class="nav-menu">
                <a href="/dashboard" class="nav-item">Dashboard</a>
                <div class="nav-selected">Search Account</div>
                <a href="/deposit" class="nav-item">Deposit</a>
                <a href="/withdraw" class="nav-item">Withdraw</a>
                <a href="/registrations" class="nav-item">Registration</a>
                <a href="/history" class="nav-item">Transaction</a>
            </div>

            <!-- Logout Section -->
            <div class="nav-logout">
                <a href="/login" onclick="tellerLogout(); return false;">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            
            <!-- Search Container -->
            <div class="search-container">
                <div class="search-input-box">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        id="search_input" 
                        class="search-input" 
                        placeholder="Search by Account Number or Name"
                        autocomplete="off"
                    >
                    <button type="button" id="clear_search_btn" class="clear-search-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Account Results Container -->
                <div class="account-container"></div>

                <!-- Transaction Modal (Hidden by default) -->
                <div class="transaction-modal" id="transaction_form">
                    <div class="transaction-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Container -->
    <div id="notification_container" class="notification-container"></div>

    <!-- JavaScript -->
    <script type="module" src="/teller/js/search_account.js"></script>
    <script type="module" src="/teller/js/logout.js"></script>
</body>
</html>
