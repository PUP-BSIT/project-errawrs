<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller Search Account</title>
    <link 
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" 
          rel="stylesheet">
    <link 
          rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/bank_teller_search_account.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1><span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <a href="bank_teller_view_profile.html">
                    <img src="../assets/images/profile_bank_teller.jpg"
                         alt="User Avatar" class="user-avatar">
                </a>
                <div class="user-name">Jovani Avi</div>
            </div>
            
            <div class="nav-menu">
                <a href="bank_teller_dashboard.html" class="nav-item">Dashboard</a>
                <div class="nav-selected">Search Account</div>
                <a href="bank_teller_history.html" class="nav-item">History</a>
            </div>

            <div class="nav-logout">
                <a href="./bank_teller_login.html">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="top-icon"><i class="fa-regular fa-bell"></i></div>
                <div class="top-icon"><i class="fa-regular fa-square-plus"></i></div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" 
                           class="search-input" 
                           id="search_input"
                           placeholder="Search Account Number">
                </div>
            </div>

            <!-- Account Container -->
            <div class="account-container">
                <!-- Account Card -->
                <div class="account-card" id="account_card" onclick="toggleAccountActions()">
                    <div class="account-info">
                        <div class="account-label">Account Number</div>
                        <div class="account-value" id="account_number"></div>
                        
                        <div class="account-label">Account Holder Name</div>
                        <div class="account-value" id="account_name"></div>
                        
                        <div class="account-label">Account Type</div>
                        <div class="account-value" id="account_type"></div>
                        
                        <div class="account-label">Current Balance</div>
                        <div class="account-value" id="account_balance"></div>
                        
                        <div class="account-label">Account Status</div>
                        <div class="account-value" id="account_status"></div>
                    </div>
                    <div class="toggle-icon">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                    <div class="card-icon">
                        <i class="fas fa-user-circle"></i>
                    </div>
                </div>

                <!-- Account Actions -->
                <div class="account-actions" id="account_actions">
                    <button class="action-btn deposit" onclick="showDepositForm()">
                        <i class="fas fa-plus"></i> Deposit
                    </button>
                    <button class="action-btn withdraw" onclick="showWithdrawForm()">
                        <i class="fas fa-minus"></i> Withdraw
                    </button>
                    <button class="action-btn close" onclick="closeAccount()">
                        <i class="fas fa-times"></i> Close Account
                    </button>
                </div>
            </div>

            <!-- Search History -->
            <div class="search-history" id="search_history">
                <h2>Search History</h2>
                <div class="history-header">
                    <div class="header-cell">Number</div>
                    <div class="header-cell">Account Name</div>
                    <div class="header-cell">Account Number</div>
                    <div class="header-cell">Balance</div>
                    <div class="header-cell">Status</div>
                </div>
                <div class="history-body" id="history_body"></div>
            </div>

            <!-- Transaction Modal -->
            <div class="transaction-modal" id="transaction_form">
                <div class="transaction-container"></div>
            </div>
        </div>
    </div>

    <div id="notification_container" class="notification-container"></div>
    <script src="./js/search_account.js"></script>
</body>
</html>
