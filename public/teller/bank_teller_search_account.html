<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Overcash</title>
    <link 
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" 
          rel="stylesheet">
    <link 
          rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/bank_teller_search_account.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>Stack <span class="overcash">Overcash</span></h1>
            </div>
            
            <div class="user-profile">
                <img src="../assets/images/profile_bank_teller.jpg"
                     alt="User Avatar" class="user-avatar">
                <div class="user-name">Kirfloy Bugoy</div>
            </div>
            
            <div class="nav-menu">
                <a href="bank_teller_dashboard.html" 
                      class="nav-item">Dashboard</a>
                <div class="nav-selected">Search Account</div>
                <a href="bank_teller_history.html"
                      class="nav-item">History</a>
            </div>

            <div class="nav-logout">
                <a href="./bank_teller_login.html">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-icons">
                    <div class="top-icon"><i class="fa-regular fa-bell"></i></div>
                    <div class="top-icon"><i class="fa-regular fa-square-plus"></i></div>
                </div>
            </div>

            <div class="welcome-section">
                <div class="greeting-container">
                    <div class="hello-text">Hello</div>
                    <div class="name-text">Kirfloy Bugoy!</div>
                </div>
                <div class="search-container">
                    <label class="search-label">Search Account</label>
                    <div class="search-input-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" id="search_input"
                              placeholder="Account Number, Name, or Phone Number" 
                              onkeyup="searchAccount()">
                    </div>
                </div>
            </div>

            <div class="account-section">
                <div class="account-container">
                    <div class="account-details" id="account_details" 
                          onclick="toggleAccountActions()">
                        <div class="account-left">
                            <div class="account-field">
                                <div class="account-label">Account Number</div>
                                <div class="account-value" id="account_number"></div>
                            </div>
                            <div class="account-field">
                                <div class="account-label">Account Holder Name</div>
                                <div class="account-value" id="account_name"></div>
                            </div>
                            <div class="account-field">
                                <div class="account-label">Account Type</div>
                                <div class="account-value" id="account_type"></div>
                            </div>
                            <div class="account-field">
                                <div class="account-label">Current Balance</div>
                                <div class="balance-value" id="account_balance"></div>
                            </div>
                            <div class="account-field">
                                <div class="account-label">Account Status</div>
                                <div class="status-active" id="account_status">
                                    <div class="status-icon">✓</div>
                                    Active
                                </div>
                            </div>
                        </div>
                        
                        <div class="account-dropdown-icon">
                            <i class="fas fa-chevron-down" id="dropdownIcon"></i>
                        </div>
                    </div>
                </div>

                <!-- Account Actions Dropdown -->
                <div class="account-actions-dropdown" id="accountActionsDropdown">
                    <button class="action-option deposit-option" 
                        onclick="showDepositForm()">
                        <i class="fas fa-plus"></i>
                        Deposit
                    </button>
                    <button class="action-option withdraw-option"
                         onclick="showWithdrawForm()">
                        <i class="fas fa-minus"></i>
                        Withdraw
                    </button>
                    <button class="action-option" onclick="closeAccount()">
                        <i class="fas fa-times-circle"></i>
                        Close Account
                    </button>
                    <button class="action-option" onclick="reopenAccount()">
                        <i class="fas fa-check-circle"></i>
                        Re-open Account
                    </button>
                </div>

                <!-- Transaction Form -->
                <div class="transaction-form" id="transaction_form">
                    <div class="transaction-container">
                        <div class="transaction-header">
                            <h2>Deposit</h2>
                            <p>Current Balance: ₱0.00</p>
                        </div>
                        <div class="transaction-form-content">
                            <div class="form-group">
                                <label for="transaction_amount">Enter Amount</label>
                                <input type="number" id="transaction_amount" 
                                      placeholder="₱0.00" step="0.01" min="0">
                            </div>
                            <div class="form-actions">
                                <button class="form-btn cancel-btn" 
                                      onclick="hideTransactionForm()">
                                    Cancel</button>
                                <button class="form-btn confirm-btn" 
                                      onclick="processTransaction('deposit')">
                                    Confirm</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="search-history">
                <div class="history-title">Recent Searches</div>
                <div class="history-table">
                    <div class="history-header">
                        <div class="history-header-value">Number</div>
                        <div class="history-header-value">Account Name</div>
                        <div class="history-header-value">Account Number</div>
                    </div>
                    <div class="history-body" id="history_body"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="notification_container" class="notification-container"></div>
    <script src="./js/search_account.js"></script>
</body>
</html>
