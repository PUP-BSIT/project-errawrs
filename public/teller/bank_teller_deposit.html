<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller Deposit</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/bank_teller_transaction.css">
</head>
<body>
    <div class="transaction-page">
        <div id="notification_container" class="notification-container"></div>
        
        <div class="transaction-section">
            <div class="transaction-container">
                <div class="transaction-header">
                    <h2>Deposit Transaction</h2>
                    <div class="account-info">
                        <div class="info-item">
                            <span class="label">Account Number:</span>
                            <span class="value" id="account_number"></span>
                        </div>
                        <div class="info-item">
                            <span class="label">Account Name:</span>
                            <span class="value" id="account_name"></span>
                        </div>
                        <div class="info-item">
                            <span class="label">Current Balance:</span>
                            <span class="value" id="account_balance"></span>
                        </div>
                    </div>
                </div>
                
                <div class="transaction-form">
                    <div class="form-group">
                        <label for="deposit_amount">
                            Enter Deposit Amount
                        </label>
                        <input type="number" id="deposit_amount" 
                              placeholder="₱0.00" step="0.01" min="0">
                    </div>
                    
                    <div class="form-actions">
                        <button class="form-btn cancel-btn" 
                              onclick="returnToSearch()">Cancel</button>
                        <button class="form-btn confirm-btn" 
                              onclick="processDeposit()">Confirm Deposit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/bank_teller_transaction.js"></script>
</body>
</html>
