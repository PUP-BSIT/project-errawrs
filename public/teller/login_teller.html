<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackOvercash Teller Login</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link rel="stylesheet" href="/teller/css/bank_teller_login.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-form-container">
            <div class="login-header-top">
                <h1 class="login-logo">
                    Stack<span class="green">Overcash</span>
                </h1>
                <p class="welcome-text">Teller Portal</p>
            </div>

            <form id="login_form" class="login-form">
                <div class="form-group">
                    <input type="text" id="teller_number" name="teller_number" placeholder="Teller Number" class="login-input" required />
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Password" class="login-input" required />
                    <button type="button" class="password-toggle" data-target="password">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>

                <button type="submit" class="login-button">Login</button>
            </form>
        </div>

        <div class="login-illustration">
            <header>
                <nav class="nav">
                    <ul class="nav-links">
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="../contact_us.html">Contact Us</a></li>
                    </ul>
                </nav>
            </header>
            <img src="../assets/images/vector_person_teller.png" alt="Teller dashboard illustration" />
        </div>
    </div>

    <!-- Add notification styles -->
    <style>
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 4px;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transform: translateX(120%);
            transition: transform 0.3s ease;
            z-index: 1000;
            max-width: 350px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification-success {
            border-left: 4px solid #4CAF50;
        }

        .notification-error {
            border-left: 4px solid #f44336;
        }

        .notification-warning {
            border-left: 4px solid #ff9800;
        }

        .notification-info {
            border-left: 4px solid #2196F3;
        }

        .notification-close {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            color: #666;
        }

        .notification-close:hover {
            color: #333;
        }

        .notification i {
            font-size: 1.2em;
        }

        .notification-success i {
            color: #4CAF50;
        }

        .notification-error i {
            color: #f44336;
        }

        .notification-warning i {
            color: #ff9800;
        }

        .notification-info i {
            color: #2196F3;
        }
    </style>

    <script src="/teller/js/teller_login.js"></script>
</body>

</html>
