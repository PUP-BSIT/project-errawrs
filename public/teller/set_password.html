<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Teller Password</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
        .container { max-width: 400px; margin: 60px auto; background: #fff; padding: 32px 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 18px; }
        input { width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .msg { margin: 12px 0; padding: 10px; border-radius: 4px; }
        .msg.success { background: #e0f7e9; color: #256029; }
        .msg.error { background: #fdecea; color: #b71c1c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Set Your Teller Password</h2>
        <form id="passwordForm">
            <input type="password" id="password" placeholder="Enter New Password" required minlength="8">
            <button type="submit">Set Password</button>
        </form>
        <div id="message" class="msg" style="display:none;"></div>
    </div>
    <script>
        // Get teller_email from URL
        const urlParams = new URLSearchParams(window.location.search);
        const teller_email = urlParams.get('teller_email');
        const form = document.getElementById('passwordForm');
        const msgDiv = document.getElementById('message');

        if (!teller_email) {
            msgDiv.textContent = 'Invalid or missing teller email.';
            msgDiv.className = 'msg error';
            msgDiv.style.display = 'block';
            form.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgDiv.style.display = 'none';
            const password = document.getElementById('password').value;
            if (password.length < 8) {
                msgDiv.textContent = 'Password must be at least 8 characters.';
                msgDiv.className = 'msg error';
                msgDiv.style.display = 'block';
                return;
            }
            try {
                const res = await fetch('/project-errawrs/src/api/teller/set_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ teller_email, password })
                });
                const data = await res.json();
                if (data.success) {
                    msgDiv.textContent = data.message;
                    msgDiv.className = 'msg success';
                    msgDiv.style.display = 'block';
                    form.style.display = 'none';
                } else {
                    msgDiv.textContent = data.message || 'Failed to set password.';
                    msgDiv.className = 'msg error';
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.textContent = 'Server error. Please try again later.';
                msgDiv.className = 'msg error';
                msgDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
