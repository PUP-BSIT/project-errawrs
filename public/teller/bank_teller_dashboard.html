<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller Dashboard</title>
    <link 
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" 
          rel="stylesheet">
    <link 
          rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./css/bank_teller_dashboard.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1><span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <a href="bank_teller_view_profile.html">
                    <img src="../assets/images/profile_bank_teller.jpg"
                     alt="User Avatar" class="user-avatar"></a>
                <div class="user-name"></div>
            </div>
            
            <div class="nav-menu">
                <div class="nav-selected">Dashboard</div>
                <a href="bank_teller_search_account.html" 
                      class="nav-item">Search Account</a>
                <a href="bank_teller_history.html" 
                      class="nav-item">History</a>
            </div>
            
            <div class="nav-logout">
                <a href="./bank_teller_login.html">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="top-bar">
                <div class="top-icon"><i class="fa-regular fa-bell"></i></div>
                <div class="top-icon">
                    <i class="fa-regular fa-square-plus"></i></div>
            </div>

            <div class="welcome-section">
                <div class="greeting-container">
                    <div class="hello-text">Hello</div>
                    <div class="name-text"></div>
                </div>
            </div>

            <div class="summary-section">
                <div class="summary-title">Summary</div>
                <div class="summary-table">
                    <div class="summary-header">
                        <div class="summary-header-cell">Icon</div>
                        <div class="summary-header-cell">Title</div>
                        <div class="summary-header-cell">Amount/Count</div>
                        <div class="summary-header-cell">Last Updated</div>
                    </div>
                    <div class="summary-body">
                        <div class="summary-row">
                            <div class="summary-icon">💸</div>
                            <div class="summary-cell">Total Deposits Today</div>
                            <div class="summary-amount" id="total-deposits">₱0.00</div>
                            <div class="summary-cell" id="deposits-updated">--:-- --</div>
                        </div>
                        <div class="summary-row">
                            <div class="summary-icon">💰</div>
                            <div class="summary-cell">Total Withdrawals Today</div>
                            <div class="summary-amount" id="total-withdrawals">₱0.00</div>
                            <div class="summary-cell" id="withdrawals-updated">--:-- --</div>
                        </div>
                        <div class="summary-row">
                            <div class="summary-icon">🔒</div>
                            <div class="summary-cell">Total Closed Accounts</div>
                            <div class="summary-amount" id="total-closed">0 Accounts</div>
                            <div class="summary-cell" id="closed-updated">--:-- --</div>
                        </div>
                        <div class="summary-row">
                            <div class="summary-icon">🔓</div>
                            <div class="summary-cell">Total Re-opened Accounts</div>
                            <div class="summary-amount" id="total-reopened">0 Accounts</div>
                            <div class="summary-cell" id="reopened-updated">--:-- --</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="notification_container" class="notification-container"></div>
    <script src="./js/teller_dashboard.js"></script>
</body>
</html>
