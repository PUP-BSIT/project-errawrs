<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/soc-logo.png" />
    <title>Bank Teller View Profile</title>
    <link 
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" 
          rel="stylesheet">
    <link 
          rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/teller/css/bank_teller_view_profile.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>
                    <span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <a href="/profile">
                    <div class="user-avatar dynamic-avatar"></div>
                </a>
                <div class="user-name" id="user_name"></div>
            </div>
            
            <div class="nav-menu">
                <a href="/dashboard" class="nav-item">Dashboard</a>
                <a href="/search" class="nav-item">Search Account</a>
                <a href="/deposit" class="nav-item">Deposit</a>
                <a href="/withdraw" class="nav-item">Withdraw</a>
                <a href="/registrations" class="nav-item">Review Registration</a>
                <a href="/history" class="nav-item">Transaction</a>
            </div>
            
            <div class="nav-logout">
                <a href="/login" onclick="tellerLogout(); return false;">
                    Log out <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="page-header">
                <span>View Account</span>
            </div>
            
            <div class="account-card" id="account_card">
                <div class="account-avatar" id="account_avatar">
                    <div class="user-avatar dynamic-avatar"></div>
                </div>
                <div class="account-info" id="account_info">
                    <span class="label">First Name</span>
                    <span class="value" id="first_name"></span>
                    
                    <span class="label">Last Name</span>
                    <span class="value" id="last_name"></span>
                    
                    <span class="label">Email Address</span>
                    <span class="value" id="email_address"></span>
                    
                    <span class="label">Status</span>
                    <span class="value" id="status"></span>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/teller/js/view_profile.js"></script>
    <script type="module" src="/teller/js/logout.js"></script>
</body>
</html>
