<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Teller Password</title>
    <link rel="stylesheet" href="/project-errawrs/public/user/css/styles.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background: #f6f9f6; }
        .container { background: #fff; padding: 2rem 2.5rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 400px; width: 100%; }
        .error { color: #c00; margin-bottom: 1rem; }
        .success { color: #080; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input[type="email"], input[type="password"] { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #7ed957; color: #fff; border: none; padding: 0.7rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Your Password</h2>
        <div id="message"></div>
        <form id="resetForm" style="display:none;">
            <div class="form-group">
                <label for="teller_email">Email</label>
                <input type="email" id="teller_email" name="teller_email" required readonly>
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>
    </div>
    <script>
    function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    const teller_email = getQueryParam('teller_email');
    const messageDiv = document.getElementById('message');
    const form = document.getElementById('resetForm');
    const emailInput = document.getElementById('teller_email');

    if (!teller_email) {
        messageDiv.innerHTML = '<div class="error">Invalid or missing reset link. Please check your email or contact support.</div>';
    } else {
        emailInput.value = teller_email;
        form.style.display = 'block';
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            if (password !== confirm) {
                messageDiv.innerHTML = '<div class="error">Passwords do not match.</div>';
                return;
            }
            if (password.length < 8) {
                messageDiv.innerHTML = '<div class="error">Password must be at least 8 characters.</div>';
                return;
            }
            messageDiv.innerHTML = 'Processing...';
            try {
                const res = await fetch('/project-errawrs/src/api/teller/set_password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ teller_email, password })
                });
                const data = await res.json();
                if (data.success) {
                    messageDiv.innerHTML = '<div class="success">Your password has been reset! You can now <a href="/project-errawrs/public/teller/bank_teller_login.html">log in</a>.</div>';
                    form.style.display = 'none';
                } else {
                    messageDiv.innerHTML = `<div class="error">${data.message || 'Failed to reset password.'}</div>`;
                }
            } catch (err) {
                messageDiv.innerHTML = '<div class="error">Server error. Please try again later.</div>';
            }
        });
    }
    </script>
</body>
</html>
