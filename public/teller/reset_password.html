<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/soc-logo.png" />
    <title>Reset Teller Password</title>
    <link rel="stylesheet" href="./css/reset_password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo"><span class="stackovercash-stack">Stack</span><span class="stackovercash-overcash">Overcash</span></div>
        <h2>Reset Your Password</h2>
        <div id="message"></div>
        <form id="resetPasswordForm" style="display:none;">
            <div class="form-group">
                <label>Email</label>
                <div class="email-label" id="email_label"></div>
            </div>
            <div class="form-group">
                <label for="teller_number">Teller Number</label>
                <div class="teller-number-display" id="teller_number_display"></div>
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="password-input-container">
                    <input type="password" id="password" name="password" minlength="8" required>
                    <i class="fas fa-eye-slash password-toggle" id="password_toggle"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-input-container">
                    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
                    <i class="fas fa-eye-slash password-toggle" id="confirm_password_toggle"></i>
                </div>
            </div>
            <button type="submit">Reset Password</button>
        </form>
    </div>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>
    </div>
    <script src="./js/reset_password.js"></script>
</body>
</html>
