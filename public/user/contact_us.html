<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - StackOvercash</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" 
          rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" 
          crossorigin="anonymous" 
          referrerpolicy="no-referrer" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/contact.css">
</head>
<body>
    <header>
        <div class="container-nav">
            <div class="logo">
                <span class="white">Stack</span>
                <span class="green">Overcash</span>
            </div>
            <ul class="nav-links">
                <li><a href="./index.html">Home</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </div>
    </header>

    <main class="main-content">
        <div class="content-container">
            <div class="contact-info-section">
                <div class="contact-content">
                    <h1>Get in Touch</h1>
                    <p class="subtitle">We're here to help you with your questions</p>
                    
                    <div class="contact-details">
                        <div class="contact-item">
                            <div class="icon-circle">
                                <i class="fas fa-phone-alt"></i>
                            </div>
                            <div class="contact-text">
                                <h3>Phone</h3>
                                <p>+63-34-123-1234</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="icon-circle">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="contact-text">
                                <h3>Email</h3>
                                <p>johndoe@gmail.com</p>
                            </div>
                        </div>
                        
                        <div class="contact-item">
                            <div class="icon-circle">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <div class="contact-text">
                                <h3>Address</h3>
                                <p>Taguig City</p>
                            </div>
                        </div>
                    </div>

                    <div class="illustration-wrapper">
                        <img src="../assets/images/contact.png" 
                             alt="Contact us illustration"
                             class="contact-illustration">
                    </div>
                </div>
            </div>

            <div class="contact-form-section">
                <div class="form-container">
                    <form class="contact-form" id="contact_form">
                        <div class="form-group">
                            <input type="text" 
                                   class="form-input" 
                                   placeholder="Full Name"
                                   id="full_name" 
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="email" 
                                   class="form-input" 
                                   placeholder="Email Address"
                                   id="email_address" 
                                   required>
                        </div>

                        <div class="form-group">
                            <input type="text" 
                                   class="form-input" 
                                   placeholder="Subject"
                                   id="message_subject" 
                                   required>
                        </div>

                        <div class="form-group">
                            <textarea class="form-input message-input" 
                                      placeholder="Your Message"
                                      id="message_content" 
                                      required></textarea>
                        </div>

                        <button type="submit" 
                                class="submit-button" 
                                id="submit_button">
                            Send Message
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="./js/contact.js"></script>
</body>
</html>
