<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - StackOvercash</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" 
          rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/contact.css">
</head>
<body>
    <header class="main-header">
        <div class="site-logo">Stack<span>Overcash</span></div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="registration.html">Registration</a>
            <a href="#privacy">Privacy Policy</a>
        </nav>
    </header>

    <div class="content-container">
        <div class="contact-form-wrapper">
            <div class="form-header-section">
                <h2>Contact Us</h2>
                <p class="header-subtitle">
                    We're here to help you with your Questions
                </p>
            </div>

            <form class="contact-form-element" id="contact_form">
                <div class="input-group">
                    <input type="text" 
                           class="form-input-field" 
                           placeholder="Full Name"
                           id="full_name" 
                           required>
                </div>

                <div class="input-group">
                    <input type="email" 
                           class="form-input-field" 
                           placeholder="Email Address"
                           id="email_address" 
                           required>
                </div>

                <div class="input-group">
                    <input type="text" 
                           class="form-input-field" 
                           placeholder="Subject"
                           id="message_subject" 
                           required>
                </div>

                <div class="input-group">
                    <textarea class="form-input-field message-textarea" 
                              placeholder="Your Message"
                              id="message_content" 
                              required></textarea>
                </div>

                <button type="submit" 
                        class="form-submit-button" 
                        id="submit_button">
                    Send Message
                </button>
            </form>
        </div>

        <div class="contact-info-section">
            <div class="illustration-wrapper">
                <img src="../../assets/images/contact.png" 
                     alt="Contact us illustration"
                     class="contact-illustration-image">
            </div>

            <div class="contact-details-container">
                <div class="contact-detail-item">
                    <div class="contact-detail-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div class="contact-detail-label">Phone:</div>
                    <div class="contact-detail-value">+63-34-123-1234</div>
                </div>

                <div class="contact-detail-item">
                    <div class="contact-detail-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="contact-detail-label">Email:</div>
                    <div class="contact-detail-value">johndoe@gmail.com</div>
                </div>

                <div class="contact-detail-item">
                    <div class="contact-detail-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="contact-detail-label">Address:</div>
                    <div class="contact-detail-value">Taguig City</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="./js/contact.js"></script>
</body>
</html>
