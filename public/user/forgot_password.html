<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackOvercash - Forgot Password</title>
    <link rel="icon" type="image/png" href="assets/images/soc-logo.png" />
    <link rel="stylesheet" href="user/css/login_acc_holder.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body class="login-page">
    <div class="notification-container"></div>
    <div class="login-container">
        <div class="login-form-container">
            <div class="login-header-top">
                <h1 class="login-logo">
                    Stack<span class="green">Overcash</span>
                </h1>
                <p class="welcome-text">Reset Your Password</p>
            </div>

            <form id="forgot_password_form" class="login-form">
                <div class="form-group">
                    <p class="recover-instructions">Enter the phone number associated with your account, and we'll send a password reset link to your registered email address.</p>
                    <input type="tel" id="phone_number" name="phone_number" placeholder="Phone Number" class="login-input" required />
                </div>
                <button type="submit" class="login-button">Send Reset Link</button>
                <div class="forgot-links">
                    <a id="back-to-login-link" class="forgot-link">Back to Login</a>
                </div>
            </form>
        </div>

        <div class="login-illustration">
            <header>
                <nav class="nav">
                    <ul class="nav-links">
                        <li><a href="/">Home</a></li>
                        <li><a href="contact">Contact Us</a></li>
                        <li><a href="#">Privacy Policy</a></li>
                    </ul>
                </nav>
            </header>
            <img src="assets/images/vector_person_acc_holder.png" alt="Person with account statistics" />
        </div>
    </div>
    <script src="user/js/config.js"></script>
    <script>
document.getElementById('back-to-login-link').href = ROUTES.LOGIN;
</script>
    <script src="user/js/forgot_password.js"></script>
</body>
</html>
