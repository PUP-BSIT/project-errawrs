<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>StackOvercash - Transaction History</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"/>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link rel="stylesheet" href="./css/user_dashboard.css?v=1.1"/>
        <link rel="stylesheet" href="./css/transaction.css?v=1.1"/>
    </head>
    <body class="authenticated-page">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <div class="sidebar" style="background-color:#000;">
                <div class="sidebar-logo" style="margin: 32px 0 24px 0; display: flex; justify-content: center; align-items: center;">
                    <span class="logo" style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;">
                        Stack<span class="logo-overcash" style="color: #b6ff4a;">Overcash</span>
                    </span>
                </div>
                <div class="user-profile">
                    <div class="avatar" id="user_avatar_container" aria-label="User avatar">
                        <!-- User initial will go here -->
                        <div class="edit-icon hidden" id="edit_profile_icon">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <!-- Removed username from sidebar -->
                </div>
                <nav class="sidebar-nav" aria-label="Main navigation">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="./user_dashboard.html" class="nav-link" data-page="dashboard" aria-label="Dashboard">
                                <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./transfer.html" class="nav-link" data-page="transfer" aria-label="Transfer funds">
                                <i class="fas fa-exchange-alt" aria-hidden="true"></i>
                                Transfer
                            </a>
                        </li>
                        <li class="nav-item active">
                            <a href="./transaction.html" class="nav-link" data-page="transaction" aria-label="View transactions">
                                <i class="fas fa-receipt" aria-hidden="true"></i>
                                Transactions
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./account.html" class="nav-link" data-page="account" aria-label="Manage accounts">
                                <i class="fas fa-wallet" aria-hidden="true"></i>
                                Account
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./profile.html" class="nav-link" data-page="profile" aria-label="User profile">
                                <i class="fas fa-user-circle" aria-hidden="true"></i>
                                Profile
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <button class="logout-btn" id="logout_btn" aria-label="Log out of account">
                        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                        Log out
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <header class="main-header">
                </header>

                <!-- Transaction History Content -->
                <div class="transaction-history-content">
                    <h2>Transaction History</h2>

                    <div class="transaction-table-container">
                        <table class="transaction-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Account Number</th>
                                    <th>Amount</th>
                                    <th>Description</th>
                                    <th>Reference Number</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-table-body">
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination-container">
                        <div class="pagination-buttons">
                            <button id="previous-page-button">Previous</button>
                            <div class="page-numbers" id="page-numbers">
                            </div>
                            <button id="next-page-button">Next</button>
                        </div>

                        <div class="pagination-controls">
                            <span>Per Page</span>
                            <select id="items-per-page">
                                <option value="5">05</option>
                                <option value="10">10</option>
                                <option value="20">20</option>
                            </select>
                             <i class="fas fa-angle-down select-arrow"></i>

                            <span id="showing-info">Showing 1 to 05 of 15</span>
                            <button id="go-button">Go</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="notification-container"></div>

        <script src="./js/config.js"></script>
        <script src="./js/auth-guard.js"></script>
        <script src="./js/session-manager.js"></script>
        <script src="./js/transaction.js"></script>
    </body>
</html>
