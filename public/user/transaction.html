<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>StackOvercash - Transaction History</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"/>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link rel="stylesheet" href="/css/user_dashboard.css?v=1.1"/>
        <link rel="stylesheet" href="/css/transaction.css?v=1.1"/>
    </head>
    <body class="authenticated-page">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <span class="logo-stack">Stack</span>
                        <span class="logo-overcash">Overcash</span>
                    </div>
                </div>

                <div class="user-profile">
                    <div class="avatar" id="user_avatar_container">
                        <!-- User initial will go here -->
                        <div class="edit-icon hidden" id="edit_profile_icon">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <h3 class="username" id="user_name"></h3>
                </div>

                <nav class="sidebar-nav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="/user_dashboard.html" class="nav-link" data-page="dashboard">
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/transfer.html" class="nav-link" data-page="transfer">
                                Transfer
                            </a>
                        </li>
                        <li class="nav-item active"> <!-- Active class for Transaction -->
                            <a href="/transaction.html" class="nav-link" data-page="transaction">
                                Transaction
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/account.html" class="nav-link" data-page="account">
                                Account
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/profile.html" class="nav-link" data-page="profile">
                                Profile
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <a href="/index.html" class="logout-btn" id="logout_btn">
                        <i class="fas fa-sign-out-alt"></i>
                        Log out
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <header class="main-header">
                    <div class="header-actions">
                        <button
                            class="icon-btn notification-btn"
                            id="notification_btn">
                            <i class="fas fa-bell"></i>
                        </button>
                        <button class="icon-btn add-btn" id="add_btn">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="icon-btn help-btn" id="help_btn">
                            <i class="fas fa-question-circle"></i>
                        </button>
                    </div>
                </header>

                <!-- Transaction History Content -->
                <div class="transaction-history-content">
                    <h2>Transaction History</h2>

                    <div class="transaction-table-container">
                        <table class="transaction-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Account Number</th>
                                    <th>Amount</th>
                                    <th>Reference Number</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-table-body">
                            </tbody>
                        </table>
                    </div>

                    <div class="pagination-container">
                        <div class="pagination-buttons">
                            <button id="previous-page-button">Previous</button>
                            <div class="page-numbers" id="page-numbers">
                            </div>
                            <button id="next-page-button">Next</button>
                        </div>

                        <div class="pagination-controls">
                            <span>Per Page</span>
                            <select id="items-per-page">
                                <option value="5">05</option>
                                <option value="10">10</option>
                                <option value="20">20</option>
                            </select>
                             <i class="fas fa-angle-down select-arrow"></i>

                            <span id="showing-info">Showing 1 to 05 of 15</span>
                            <button id="go-button">Go</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="notification-container"></div>

        <script src="/js/session-manager.js"></script>
        <script src="/js/transaction.js"></script> 
    </body>
</html>
