<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>StackOvercash - Transfer Success</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"/>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link rel="stylesheet" href="./css/user_dashboard.css"/> <!-- Keep some base styles -->
        <link rel="stylesheet" href="./css/transfer.css"/> <!-- Transfer specific styles -->
    </head>
    <body class="authenticated-page">
        <div class="dashboard-container">
            <!-- Sidebar (copied from transfer.html) -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <span class="logo-stack">Stack</span>
                        <span class="logo-overcash">Overcash</span>
                    </div>
                </div>

                <div class="user-profile">
                    <div class="avatar" id="user_avatar_container">
                        <!-- User initial will go here -->
                        <div class="edit-icon hidden" id="edit_profile_icon">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <h3 class="username" id="user_name"></h3>
                </div>

                <nav class="sidebar-nav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="./user_dashboard.html" class="nav-link" data-page="dashboard">
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item active"> <!-- Active class for Transfer -->
                            <a href="./transfer.html" class="nav-link" data-page="transfer">
                                Transfer
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./transaction.html" class="nav-link" data-page="transaction">
                                Transaction
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./account.html" class="nav-link" data-page="account">
                                Account
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./profile.html" class="nav-link" data-page="profile">
                                Profile
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <a href="./index.html" class="logout-btn" id="logout_btn">
                        <i class="fas fa-sign-out-alt"></i>
                        Log out
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <header class="main-header">
                    <div class="header-actions">
                        <button
                            class="icon-btn notification-btn"
                            id="notification_btn">
                            <i class="fas fa-bell"></i>
                        </button>
                        <button class="icon-btn add-btn" id="add_btn">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="icon-btn help-btn" id="help_btn">
                            <i class="fas fa-question-circle"></i>
                        </button>
                    </div>
                </header>

                <!-- Transfer Content -->
                <div class="transfer-content">
                    <h2>Transfer Successful</h2>
                    
                    <div class="transfer-panel">
                        <div class="panel-body">
                            <div class="success-notification">
                                <i class="fas fa-check-circle"></i>
                                <span>Your funds have been successfully transferred to the recipient account.</span>
                            </div>
                            
                            <div class="receipt" id="transaction-details">
                                <!-- Transaction details will be populated by JavaScript -->
                            </div>
                            
                            <a href="./transfer.html" class="next-btn">Back to Transfer</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="notification-container"></div>
        
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Parse URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                const success = urlParams.get('fund_transfer_success');
                const transactionId = urlParams.get('transaction_id');
                const amount = urlParams.get('amount');
                const sourceAccount = urlParams.get('source_account');
                const recipientAccount = urlParams.get('recipient_account');
                
                // Check if this is a successful transfer
                if (success === 'true' && transactionId) {
                    const transactionDetails = document.getElementById('transaction-details');
                    
                    // Format amount if it exists
                    const formattedAmount = amount ? '₱ ' + parseFloat(amount).toLocaleString('en-US', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }) : 'N/A';
                    
                    // Create transaction details HTML
                    transactionDetails.innerHTML = `
                        <div class="receipt-item">
                            <span class="label">Transaction ID:</span>
                            <span class="value">${transactionId}</span>
                        </div>
                        <div class="receipt-item">
                            <span class="label">Date:</span>
                            <span class="value">${new Date().toLocaleString()}</span>
                        </div>
                        <div class="receipt-item">
                            <span class="label">Amount:</span>
                            <span class="value">${formattedAmount}</span>
                        </div>
                        <div class="receipt-item">
                            <span class="label">From Account:</span>
                            <span class="value">${sourceAccount || 'N/A'}</span>
                        </div>
                        <div class="receipt-item">
                            <span class="label">To Account:</span>
                            <span class="value">${recipientAccount || 'N/A'}</span>
                        </div>
                    `;
                } else {
                    // If parameters are missing, show generic message
                    document.querySelector('h2').textContent = 'Transaction Complete';
                    document.querySelector('.success-notification span').textContent = 'Your transaction has been processed.';
                    document.getElementById('transaction-details').style.display = 'none';
                }
                
                // Also update the user avatar
                const userAvatarContainer = document.getElementById('user_avatar_container');
                if (userAvatarContainer) {
                    // Fetch user data or use a default initial
                    fetch('../../src/api/auth/session_check.php')
                        .then(res => res.json())
                        .then(data => {
                            if (data.success && data.authenticated) {
                                const userName = data.user.first_name || 'User';
                                const initial = userName.charAt(0).toUpperCase();
                                userAvatarContainer.textContent = initial;
                                
                                // Update username if element exists
                                const userNameElement = document.getElementById('user_name');
                                if (userNameElement) {
                                    userNameElement.textContent = `${data.user.first_name} ${data.user.last_name}`.trim();
                                }
                            }
                        })
                        .catch(err => {
                            console.error('Error fetching user data:', err);
                            userAvatarContainer.textContent = 'U';
                        });
                }
            });
        </script>
    </body>
</html>
