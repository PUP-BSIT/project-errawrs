<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Transfer Successful - StackOvercash</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"/>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link rel="stylesheet" href="./css/user_dashboard.css"/> <!-- Keep some base styles -->
        <link rel="stylesheet" href="./css/transfer_success.css"/> <!-- Transfer specific styles -->
    </head>
    <body class="authenticated-page">
        <div class="dashboard-container">
            <!-- Sidebar (copied from transfer.html) -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <span class="logo-stack">Stack</span>
                        <span class="logo-overcash">Overcash</span>
                    </div>
                </div>

                <div class="user-profile">
                    <div class="avatar" id="user_avatar_container">
                        <!-- User initial will go here -->
                        <div class="edit-icon hidden" id="edit_profile_icon">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <h3 class="username" id="user_name"></h3>
                </div>

                <nav class="sidebar-nav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="./user_dashboard.html" class="nav-link" data-page="dashboard">
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item active"> <!-- Active class for Transfer -->
                            <a href="./transfer.html" class="nav-link" data-page="transfer">
                                Transfer
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./transaction.html" class="nav-link" data-page="transaction">
                                Transaction
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./account.html" class="nav-link" data-page="account">
                                Account
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./profile.html" class="nav-link" data-page="profile">
                                Profile
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <a href="./index.html" class="logout-btn" id="logout_btn">
                        <i class="fas fa-sign-out-alt"></i>
                        Log out
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <header class="main-header">
                    <div class="header-actions">
                        <button
                            class="icon-btn notification-btn"
                            id="notification_btn">
                            <i class="fas fa-bell"></i>
                        </button>
                        <button class="icon-btn add-btn" id="add_btn">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="icon-btn help-btn" id="help_btn">
                            <i class="fas fa-question-circle"></i>
                        </button>
                    </div>
                </header>

                <!-- Success Content -->
                <div class="success-container">
                    <div class="success-header">
                        <div class="success-icon">
                            <i class="fas fa-check"></i>
                        </div>
                        <h1>Transfer Successful</h1>
                    </div>

                    <div class="receipt-container">
                        <div class="receipt-row">
                            <span class="receipt-label">Transaction ID</span>
                            <span class="receipt-value" id="transaction_id">97</span>
                        </div>
                        <div class="receipt-row">
                            <span class="receipt-label">Date</span>
                            <span class="receipt-value" id="transaction_date">6/6/2025, 2:57:01 AM</span>
                        </div>
                        <div class="receipt-row">
                            <span class="receipt-label">Amount</span>
                            <span class="receipt-value amount-value" id="transaction_amount">Loading...</span>
                        </div>
                        <div class="receipt-row">
                            <span class="receipt-label">From Account</span>
                            <span class="receipt-value" id="from_account">Loading...</span>
                        </div>
                        <div class="receipt-row">
                            <span class="receipt-label">To Account</span>
                            <span class="receipt-value" id="to_account">Loading...</span>
                        </div>
                    </div>

                    <a href="./transfer.html" class="back-button">
                        Back to Transfer
                    </a>
                </div>
            </div>
        </div>
        
        <div class="notification-container"></div>
        
        <script src="./js/transfer_success.js"></script>
    </body>
</html>
