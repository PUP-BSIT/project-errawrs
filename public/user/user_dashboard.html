<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>StackOvercash - Banking Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"/>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link
            rel="stylesheet"
            href="./css/user_dashboard.css?v=1.1"/>
    </head>
    <body class="authenticated-page">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <span class="logo-stack">Stack</span>
                        <span class="logo-overcash">Overcash</span>
                    </div>
                </div>

                <div class="user-profile">
                    <div class="avatar" id="user_avatar_container">
                        <!-- User initial will go here -->
                        <div class="edit-icon hidden" id="edit_profile_icon">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <h3 class="username" id="user_name"></h3>
                </div>

                <nav class="sidebar-nav">
                    <ul class="nav-list">
                        <li class="nav-item active">
                            <a
                                href="../user/user_dashboard.html"
                                class="nav-link">
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a
                                href="../user/transfer.html"
                                class="nav-link"
                                data-page="transfer">
                                Transfer
                            </a>
                        </li>
                        <li class="nav-item">
                            <a
                                href="../user/transaction.html"
                                class="nav-link"
                                data-page="transaction">
                                Transaction
                            </a>
                        </li>
                        <li class="nav-item">
                            <a
                                href="../user/account.html"
                                class="nav-link"
                                data-page="account">
                                Account
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="../user/profile.html" class="nav-link" data-page="profile">
                                Profile
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <a href="./index.html" class="logout-btn" id="logout_btn">
                        <i class="fas fa-sign-out-alt"></i>
                        Log out
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <header class="main-header">
                    <div class="header-actions">
                        <button
                            class="icon-btn notification-btn"
                            id="notification_btn">
                            <i class="fas fa-bell"></i>
                        </button>
                        <button class="icon-btn add-btn" id="add_btn">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="icon-btn help-btn" id="help_btn">
                            <i class="fas fa-question-circle"></i>
                        </button>
                    </div>
                </header>

                <!-- Notice Banner -->
                <div class="notice-banner">
                    <div class="notice-content">
                        <i class="fas fa-exclamation-triangle notice-icon"></i>
                        <span class="notice-text">
                            <strong>Notice:</strong> Our bank will be closed on
                            May 13, 2025 (Tuesday) in observance of a national
                            holiday. Online banking services will remain
                            available.
                        </span>
                    </div>
                </div>

                <!-- Dashboard Content -->
                <div class="dashboard-content">
                    <div class="left-section">
                        <div class="welcome-section">
                            <h1 class="welcome-title">Hello<br /><span id="welcome_user_name"></span>!</h1>
                        </div>

                        <div class="balance-card">
                            <div id="account-display-container">
                            </div>
                            <div class="balance-amount" id="account_balance">
                            </div>
                        </div>

                        <a href="./transfer.html" class="transfer-btn" id="transfer_now_btn">
                            Transfer Now
                        </a>
                    </div>

                    <div class="right-section">
                        <div class="financial-tip" id="financial_tip_container">
                            <!-- Financial tip will be dynamically populated -->
                        </div>

                        <div class="transactions-card">
                            <h2 class="transactions-title">
                                Recent Transaction
                            </h2>

                            <div class="transaction-header">
                                <span class="header-tag date-tag">Date</span>
                                <span class="header-tag amount-tag"
                                    >Amount
                                </span>
                            </div>

                            <div class="transaction-list" id="transaction_list">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="notification-container"></div>

        <!-- Load configuration first -->
        <script src="./js/config.js"></script>
        
        <!-- Load API and session management -->
        <script src="./js/api.js"></script>
        <script src="./js/session-manager.js"></script>
        
        <!-- Load page-specific scripts -->
        <script src="./js/user_dashboard.js"></script>
    </body>
</html>
