<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>StackOvercash - Banking Dashboard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"/>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link
            rel="stylesheet"
            href="./css/user_dashboard.css?v=1.1"/>
    </head>
    <body class="authenticated-page">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <div class="sidebar" style="background-color:#000;">
                <div class="sidebar-header">
                    <div class="logo">
                        <span class="logo-stack">Stack</span>
                        <span class="logo-overcash">Overcash</span>
                    </div>
                </div>
                <div class="user-profile">
                    <div class="avatar" id="user_avatar_container" aria-label="User avatar">
                        <!-- User initial will go here -->
                        <div class="edit-icon hidden" id="edit_profile_icon">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <h3 class="username" id="user_name"></h3>
                </div>
                <nav class="sidebar-nav" aria-label="Main navigation">
                    <ul class="nav-list">
                        <li class="nav-item active">
                            <a href="./user_dashboard.html" class="nav-link" data-page="dashboard" aria-label="Dashboard">
                                <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./transfer.html" class="nav-link" data-page="transfer" aria-label="Transfer funds">
                                <i class="fas fa-exchange-alt" aria-hidden="true"></i>
                                Transfer
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./transaction.html" class="nav-link" data-page="transaction" aria-label="View transactions">
                                <i class="fas fa-receipt" aria-hidden="true"></i>
                                Transactions
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./account.html" class="nav-link" data-page="account" aria-label="Manage accounts">
                                <i class="fas fa-wallet" aria-hidden="true"></i>
                                Account
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./profile.html" class="nav-link" data-page="profile" aria-label="User profile">
                                <i class="fas fa-user-circle" aria-hidden="true"></i>
                                Profile
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <button class="logout-btn" id="logout_btn" aria-label="Log out of account">
                        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                        Log out
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <header class="main-header">
                </header>

                <!-- Notice Banner -->
                <div class="notice-banner">
                    <div class="notice-content">
                        <i class="fas fa-exclamation-triangle notice-icon"></i>
                        <span class="notice-text">
                            <strong>Notice:</strong> Our bank will be closed on
                            May 13, 2025 (Tuesday) in observance of a national
                            holiday. Online banking services will remain
                            available.
                        </span>
                    </div>
                </div>

                <!-- Dashboard Content -->
                <div class="dashboard-content">
                    <div class="left-section">
                        <div class="welcome-section">
                            <h1 class="welcome-title">Hello, <span id="welcome_user_name"></span>!</h1>
                        </div>

                        <div class="balance-card">
                            <div class="account-display-container" id="account-display-container">
                                <!-- Account items will be dynamically added here -->
                            </div>
                            <div class="balance-amount" id="account_balance">
                                <!-- Balance will be dynamically added here -->
                            </div>
                        </div>

                        <a href="./transfer.html" class="transfer-btn" id="transfer_now_btn">
                            Transfer Now
                        </a>
                    </div>

                    <div class="right-section">
                        <div class="financial-tip" id="financial_tip_container">
                            <!-- Financial tip will be dynamically populated -->
                        </div>

                        <div class="transactions-card">
                            <h2 class="transactions-title">
                                Recent Transaction
                            </h2>

                            <div class="transaction-header">
                                <span class="header-tag date-tag">Date</span>
                                <span class="header-tag amount-tag"
                                    >Amount
                                </span>
                            </div>

                            <div class="transaction-list" id="transaction_list">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="notification-container"></div>

        <!-- Load configuration first -->
        <script src="./js/config.js"></script>
        
        <!-- Load API and session management -->
        <script src="./js/api.js"></script>
        <script src="./js/session-manager.js"></script>
        
        <!-- Load page-specific scripts -->
        <script src="./js/user_dashboard.js"></script>
    </body>
</html>
