<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackOvercash - Reset Password</title>
    <link rel="icon" type="image/png" href="assets/images/soc-logo.png">
    <link rel="stylesheet" href="user/css/reset_password.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>

<body class="reset-password-page">
    <div class="notification-container"></div>
    <div class="reset-password-container">
        <div class="reset-password-form-container">
            <div class="reset-password-header-top">
                <h1 class="reset-password-logo">
                    Stack<span class="green">Overcash</span>
                </h1>
                <p class="reset-password-text">Reset your password!</p>
            </div>

            <form id="reset_password_form" class="reset-password-form">
                <div class="reset-password-form-group">
                    <input type="password"
                        id="reset_username"
                        name="reset_username"
                        placeholder="New Password"
                        class="reset-password-input"
                        required />
                    <button type="button" class="password-toggle" data-target="reset_username">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>

                <div class="reset-password-form-group">
                    <input type="password"
                        id="reset_password"
                        name="reset_password"
                        placeholder="Confirm Password"
                        class="reset-password-input"
                        required />
                    <button type="button" class="password-toggle" data-target="reset_password">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>

                <button type="submit" class="reset-password-button">Confirm Reset</button>
            </form>
        </div>

        <div class="reset-password-illustration">
            <header>
                <nav class="reset-password-nav">
                    <ul class="reset-password-nav-links">
                        <li><a href="/">Home</a></li>
                        <li><a href="contact">Contact Us</a></li>
                        <li><a href="#">Privacy Policy</a></li>
                    </ul>
                </nav>
            </header>
            <img src="assets/images/vector_person_acc_holder.png"
                alt="Person with account statistics" />
        </div>
    </div>

    <script src="user/js/config.js"></script>
    <script src="user/js/reset_password.js"></script>
    <script>
        // Show session expired modal if redirected with ?expired=true
        if (window.location.search.includes('expired=true')) {
            document.addEventListener('DOMContentLoaded', function () {
                var modal = document.getElementById('session-expired-modal');
                var okBtn = document.getElementById('session-expired-ok');
                if (modal) {
                    modal.style.display = 'flex';
                    if (okBtn) {
                        okBtn.onclick = function () {
                            modal.style.display = 'none';
                        };
                    }
                }
            });
        }
    </script>
</body>
</html>
