<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackOvercash - Reset Password</title>
    <link rel="icon" type="image/x-icon" href="/project-errawrs/public/assets/images/favicon.ico">
    <link rel="stylesheet" href="./css/login_acc_holder.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>
<body class="login-page">
    <div class="notification-container"></div>
    <div class="login-container">
        <div class="login-form-container">
            <div class="login-header-top">
                <h1 class="login-logo">
                    Stack<span class="green">Overcash</span>
                </h1>
                <p class="welcome-text">Create a New Password</p>
            </div>

            <form id="reset_password_form" class="login-form" style="display: none;">
                <input type="hidden" id="token" name="token">
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="New Password" class="login-input" required />
                    <button type="button" class="password-toggle" data-target="password">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
                <div class="form-group">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm New Password" class="login-input" required />
                    <button type="button" class="password-toggle" data-target="confirm_password">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
                <button type="submit" class="login-button">Reset Password</button>
            </form>
            <div id="message_container"></div>
        </div>
    </div>
    <script src="./js/config.js"></script>
    <script src="./js/reset_password.js"></script>
</body>
</html>
