<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackOvercash - Forgot Username</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon.ico">
    <link rel="stylesheet" href="./css/login_acc_holder.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body class="login-page">
    <div class="notification-container"></div>
    <div class="login-container">
        <div class="login-form-container">
            <div class="login-header-top">
                <h1 class="login-logo">
                    Stack<span class="green">Overcash</span>
                </h1>
                <p class="welcome-text">Recover Your Username</p>
            </div>

            <form id="forgot_username_form" class="login-form">
                <div class="form-group">
                    <p class="recover-instructions">Enter the phone number associated with your account, and we'll send your username to your registered email address.</p>
                    <input type="tel" id="phone_number" name="phone_number" placeholder="Phone Number" class="login-input" required />
                </div>
                <button type="submit" class="login-button">Recover Username</button>
                <div class="forgot-links">
                    <a href="./login_account_holder.html" class="forgot-link">Back to Login</a>
                </div>
            </form>
        </div>

        <div class="login-illustration">
            <header>
                <nav class="nav">
                    <ul class="nav-links">
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./contact_us.html">Contact Us</a></li>
                        <li><a href="#">Privacy Policy</a></li>
                    </ul>
                </nav>
            </header>
            <img src="../assets/images/vector_person_acc_holder.png" alt="Person with account statistics" />
        </div>
    </div>
    <script src="./js/config.js"></script>
    <script src="./js/forgot_username.js"></script>
</body>
</html>
