<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StackOvercash - Login Account Holder</title>
    <link rel="icon" type="image/x-icon" href="/project-errawrs/public/assets/images/favicon.ico">
    <link rel="stylesheet" href="./css/login_acc_holder.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>

<body class="login-page">
    <div class="notification-container"></div>
    <div class="login-container">
        <div class="login-form-container">
            <div class="login-header-top">
                <h1 class="login-logo">
                    Stack<span class="green">Overcash</span>
                </h1>
                <p class="welcome-text">Welcome!</p>
            </div>

            <form id="login_form" class="login-form">
                <div class="form-group">
                    <input type="text" id="username" name="username" placeholder="Username" class="login-input" required />
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Password" class="login-input" required />
                    <button type="button" class="password-toggle" data-target="password">
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>

                <button type="submit" class="login-button">Login</button>

                <div class="forgot-links">
                    <span>Forgot</span>
                    <a href="./forgot_username.html" class="forgot-link">Username</a>
                    <span>or</span>
                    <a href="./forgot_password.html" class="forgot-link">Password</a>
                </div>

                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-text">or</span>
                    <span class="divider-line"></span>
                </div>

                <a href="./registration.html" class="register-button">Register now</a>
            </form>
        </div>

        <div class="login-illustration">
            <header>
                <nav class="nav">
                    <ul class="nav-links">
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./contact_us.html">Contact Us</a></li>
                        <li><a href="#">Privacy Policy</a></li>
                    </ul>
                </nav>
            </header>
            <img src="/project-errawrs/public/assets/images/vector_person_acc_holder.png" alt="Person with account statistics" />
        </div>
    </div>

    <!-- Add notification styles -->
    <!-- Styles moved to css/login_acc_holder.css -->

    <script src="./js/config.js"></script>
    <script src="./js/login.js"></script>
</body>

</html>
