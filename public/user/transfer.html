<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>StackOvercash - Transfer</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"/>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link rel="stylesheet" href="./css/user_dashboard.css"/> <!-- Keep some base styles -->
        <link rel="stylesheet" href="./css/transfer.css"/> <!-- New transfer specific styles -->
    </head>
    <body class="authenticated-page">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <span class="logo-stack">Stack</span>
                        <span class="logo-overcash">Overcash</span>
                    </div>
                </div>

                <div class="user-profile">
                    <div class="avatar" id="user_avatar_container">
                        <!-- User initial will go here -->
                        <div class="edit-icon hidden" id="edit_profile_icon">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <h3 class="username" id="user_name"></h3>
                </div>

                <nav class="sidebar-nav">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="./user_dashboard.html" class="nav-link" data-page="dashboard">
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item active"> <!-- Active class for Transfer -->
                            <a href="./transfer.html" class="nav-link" data-page="transfer">
                                Transfer
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./transaction.html" class="nav-link" data-page="transaction">
                                Transaction
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./account.html" class="nav-link" data-page="account">
                                Account
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./profile.html" class="nav-link" data-page="profile">
                                Profile
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <a href="./index.html" class="logout-btn" id="logout_btn">
                        <i class="fas fa-sign-out-alt"></i>
                        Log out
                    </a>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <header class="main-header">
                    <div class="header-actions">
                        <button
                            class="icon-btn notification-btn"
                            id="notification_btn">
                            <i class="fas fa-bell"></i>
                        </button>
                        <button class="icon-btn add-btn" id="add_btn">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="icon-btn help-btn" id="help_btn">
                            <i class="fas fa-question-circle"></i>
                        </button>
                    </div>
                </header>

                <!-- Transfer Content -->
                <div class="transfer-content">
                    <h2>Account-Holder Transfer</h2>

                    <div class="transfer-panel" id="select-bank-panel">
                        <div class="panel-header">
                             <span class="active">SELECT BANK</span>
                             <span>Account</span>
                        </div>
                        <div class="panel-body">
                            <!-- Bank selection radio buttons here -->
                            <p id="default-bank-label" class="default-label">Default</p>
                            <div class="radio-option">
                                <input type="radio" id="stackovercash_bank" name="bank" value="StackOvercash Bank" checked>
                                <label for="stackovercash_bank">StackOvercash Bank</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="techy_blinders_bank" name="bank" value="Techy Blinders Bank">
                                <label for="techy_blinders_bank">Techy Blinders Bank</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="dragon_fly_bank" name="bank" value="Dragon Fly Bank">
                                <label for="dragon_fly_bank">Dragon Fly Bank</label>
                            </div>
                            <button class="next-btn" id="next-button" disabled>Next</button>
                        </div>
                    </div>

                    <div class="transfer-panel" id="account-details-panel" style="display: none;">
                         <div class="panel-header">
                             <span>SELECT BANK</span>
                             <span class="active">Account</span>
                        </div>
                        <div class="panel-body">
                            <!-- Account details form here -->
                            <div class="form-group">
                                <label for="your-account">Your Account</label>
                                <div class="custom-select">
                                    <select id="your-account">
                                        <!-- Account options will be dynamically populated -->
                                        <option value="">Select Account</option>
                                    </select>
                                    <i class="fas fa-angle-down select-arrow"></i>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="receiver-account">Receiver Account Number</label>
                                <input type="text" id="receiver-account" placeholder="Enter account Number">
                            </div>

                            <div class="form-group">
                                <label for="amount">Amount to Transfer [P]</label>
                                <input type="text" id="amount" placeholder="e.g 1000.00">
                            </div>

                             <div class="form-group checkbox-group">
                                <input type="checkbox" id="info-correct">
                                <label for="info-correct">The information is correct</label>
                            </div>

                            <button class="send-btn" id="send-money-button" onclick="console.log('Send Money button clicked via inline handler')">Send Money</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="notification-container"></div>

        <script src="./js/session-manager.js"></script>
        <script src="./js/transfer.js"></script>
    </body>
</html>
