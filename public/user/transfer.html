<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>StackOvercash - Transfer</title>
        <link rel="icon" type="image/png" href="../assets/images/soc-logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"/>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link rel="stylesheet" href="./css/user_dashboard.css"/> <!-- Keep some base styles -->
        <link rel="stylesheet" href="./css/transfer.css"/> <!-- New transfer specific styles -->
    </head>
    <body class="authenticated-page">
        <div class="dashboard-container">
            <!-- Sidebar -->
            <div class="sidebar" style="background-color:#000;">
                <div class="sidebar-logo" style="margin: 32px 0 24px 0; display: flex; justify-content: center; align-items: center;">
                    <span class="logo" style="font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;">
                        Stack<span class="logo-overcash" style="color: #b6ff4a;">Overcash</span>
                    </span>
                </div>
                <div class="user-profile">
                    <div class="avatar" id="user_avatar_container" aria-label="User avatar">
                        <!-- User initial will go here -->
                        <div class="edit-icon hidden" id="edit_profile_icon">
                            <i class="fas fa-pen"></i>
                        </div>
                    </div>
                    <!-- Removed username from sidebar -->
                </div>
                <nav class="sidebar-nav" aria-label="Main navigation">
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="./user_dashboard.html" class="nav-link" data-page="dashboard" aria-label="Dashboard">
                                <i class="fas fa-tachometer-alt" aria-hidden="true"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item active">
                            <a href="./transfer.html" class="nav-link" data-page="transfer" aria-label="Transfer funds">
                                <i class="fas fa-exchange-alt" aria-hidden="true"></i>
                                Transfer
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./transaction.html" class="nav-link" data-page="transaction" aria-label="View transactions">
                                <i class="fas fa-receipt" aria-hidden="true"></i>
                                Transactions
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./account.html" class="nav-link" data-page="account" aria-label="Manage accounts">
                                <i class="fas fa-wallet" aria-hidden="true"></i>
                                Account
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="./profile.html" class="nav-link" data-page="profile" aria-label="User profile">
                                <i class="fas fa-user-circle" aria-hidden="true"></i>
                                Profile
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="sidebar-footer">
                    <button class="logout-btn" id="logout_btn" aria-label="Log out of account">
                        <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
                        Log out
                    </button>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Header -->
                <header class="main-header">
                </header>

                <!-- Transfer Content -->
                <div class="transfer-content">
                    <h2>Account-Holder Transfer</h2>

                    <div class="transfer-panel" id="select-bank-panel">
                        <div class="panel-header">
                            <div class="panel-header-steps">
                                <span class="panel-header-step active">SELECT BANK</span>
                                <span class="panel-header-step">Account</span>
                            </div>
                        </div>
                        <div class="panel-body">
                            <!-- Bank selection radio buttons here -->
                            <div class="radio-option">
                                <input type="radio" id="stackovercash_bank" name="bank" value="StackOvercash Bank" checked>
                                <label for="stackovercash_bank">StackOvercash Bank</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="techy_blinders_bank" name="bank" value="Techy Blinders Bank">
                                <label for="techy_blinders_bank">Techy Blinders Bank</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="dragon_fly_bank" name="bank" value="Dragon Fly Bank">
                                <label for="dragon_fly_bank">Dragon Fly Bank</label>
                            </div>
                            <button class="next-btn" id="next-button" disabled>Next</button>
                        </div>
                    </div>

                    <div class="transfer-panel" id="account-details-panel" style="display: none;">
                        <div class="panel-header">
                            <button class="back-button" id="back-to-bank">
                                <i class="fas fa-arrow-left"></i>
                                Back
                            </button>
                            <div class="panel-header-steps">
                                <span class="panel-header-step">SELECT BANK</span>
                                <span class="panel-header-step active">Account</span>
                            </div>
                        </div>
                        <div class="panel-body">
                            <!-- Account details form here -->
                            <div class="form-group">
                                <label for="your-account">Your Account</label>
                                <div class="custom-select">
                                    <select id="your-account">
                                        <!-- Account options will be dynamically populated -->
                                        <option value="">Select Account</option>
                                    </select>
                                    <i class="fas fa-angle-down select-arrow"></i>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="receiver-account">Receiver Account Number</label>
                                <input type="text" id="receiver-account" placeholder="Enter account Number">
                            </div>

                            <div class="form-group">
                                <label for="amount">Amount to Transfer [P]</label>
                                <input type="text" id="amount" placeholder="e.g 1000.00">
                            </div>

                            <div class="form-group checkbox-group">
                                <input type="checkbox" id="info-correct">
                                <label for="info-correct">The information is correct</label>
                            </div>

                            <button class="send-btn" id="send-money-button" disabled>Send Money</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="notification-container"></div>

        <script src="./js/auth-guard.js"></script>
        <script src="./js/config.js"></script>
        <script src="./js/transfer.js"></script>

    </body>
</html>
