<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin: 10px 0;
        }
        .debug-log {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            height: 200px;
            overflow-y: auto;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Transfer Button Debug</h1>
    
    <button id="test-button" class="send-btn">Test Button (class)</button>
    <button id="test-button-style" style="background-color: #4CAF50; color: white;">Test Button (style)</button>
    
    <div class="debug-log" id="debug-log"></div>
    
    <script>
        // Debug log function
        function log(message) {
            const logElement = document.getElementById('debug-log');
            const logEntry = document.createElement('div');
            logEntry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
            logElement.appendChild(logEntry);
            logElement.scrollTop = logElement.scrollHeight;
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('Debug page loaded');
            
            // Test button with class
            const testButton = document.getElementById('test-button');
            if (testButton) {
                log('Test button (class) found');
                testButton.addEventListener('click', () => {
                    log('Test button (class) clicked');
                });
            } else {
                log('ERROR: Test button (class) not found');
            }
            
            // Test button with style
            const testButtonStyle = document.getElementById('test-button-style');
            if (testButtonStyle) {
                log('Test button (style) found');
                testButtonStyle.addEventListener('click', () => {
                    log('Test button (style) clicked');
                });
            } else {
                log('ERROR: Test button (style) not found');
            }
        });
    </script>
</body>
</html>
