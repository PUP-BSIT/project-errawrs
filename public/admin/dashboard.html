<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="../../assets/images/soc-logo.png" />
        <title>StackOvercash - Admin Dashboard</title>

        <!-- Google Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"/>

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

        <!-- Custom CSS -->
        <link rel="stylesheet" href="./css/dashboard.css" />
    </head>
    <body>
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-stack">Stack</span>
                    <span class="logo-overcash">Overcash</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item active">
                        <a href="dashboard.html" class="nav-link">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="manage_tellers.html" class="nav-link">
                            <i class="fas fa-users"></i>
                            <span>Tellers</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="user_accounts.html" class="nav-link">
                            <i class="fas fa-user-circle"></i>
                            <span>User Accounts</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="transactions.html" class="nav-link">
                            <i class="fas fa-exchange-alt"></i>
                            <span>Transactions</span>
                        </a>
                    </li>
                    <li class="nav-item logout-item">
                        <a href="#" id="logout_btn" class="nav-link">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Dashboard Content -->
            <div class="dashboard-content">
                <!-- Statistics Section -->
                <section class="content-section stats-section active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-users"></i>
                            </div>
                            <div class="stat-details">
                                <h3>Total Users</h3>
                                <p class="stat-number" id="total_users">0</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-money-bill-wave"></i>
                            </div>
                            <div class="stat-details">
                                <h3>Total Transactions</h3>
                                <p class="stat-number" id="total_transactions">0</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-user-tie"></i>
                            </div>
                            <div class="stat-details">
                                <h3>Active Tellers</h3>
                                <p class="stat-number" id="active_tellers">0</p>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-user-tie"></i>
                            </div>
                            <div class="stat-details">
                                <h3>Pending Tellers</h3>
                                <p class="stat-number" id="pending_tellers">0</p>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Search Section -->
                <section class="content-section search-section active">
                    <div class="search-container">
                        <!-- Teller Search -->
                        <div class="search-column">
                            <div class="search-box-container">
                                <h2>Search Tellers</h2>
                                <div class="search-box">
                                    <i class="fas fa-search"></i>
                                    <input type="text" id="teller_search" placeholder="Search tellers by name, ID or email...">
                                </div>
                            </div>
                            <div id="teller_results" class="results-container">
                                <!-- Loading State -->
                                <div class="loading-state" style="display: none;">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <p>Loading tellers...</p>
                                </div>
                                <!-- Results will be displayed here -->
                            </div>
                        </div>

                        <!-- User Account Search -->
                        <div class="search-column">
                            <div class="search-box-container">
                                <h2>Search User Accounts</h2>
                                <div class="search-box">
                                    <i class="fas fa-search"></i>
                                    <input type="text" id="user_search" placeholder="Search users by name or account number...">
                                </div>
                            </div>
                            <div id="user_results" class="results-container">
                                <!-- Loading State -->
                                <div class="loading-state" style="display: none;">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    <p>Loading accounts...</p>
                                </div>
                                <!-- Results will be displayed here -->
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <!-- Scripts -->
        <script src="./js/config.js"></script>
        <script src="./js/dashboard.js"></script>
    </body>
</html>
