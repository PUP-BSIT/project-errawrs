        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Password toggle functionality
                const passwordToggle = document.getElementById('password-toggle');
                const passwordInput = document.querySelector('input[name="password"]');
                
                passwordToggle.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.classList.toggle('show');
                });

                // Form submission handling
                const form = document.getElementById('login-form');
                const errorMessage = document.getElementById('error-message');

                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    errorMessage.style.display = 'none';

                    try {
                        const formData = new FormData(form);
                        const response = await fetch(form.action, {
                            method: 'POST',
                            body: JSON.stringify({
                                teller_number: formData.get('teller_number'),
                                password: formData.get('password')
                            }),
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        });

                        const data = await response.json();

                        if (data.success) {
                            // Store teller info in sessionStorage
                            sessionStorage.setItem('teller', JSON.stringify(data.teller));
                            // Redirect to teller dashboard
                            window.location.href = '../views/teller_dashboard.html';
                        } else {
                            errorMessage.textContent = data.error || 'Login failed. Please try again.';
                            errorMessage.style.display = 'block';
                        }
                    } catch (error) {
                        errorMessage.textContent = 'An error occurred. Please try again later.';
                        errorMessage.style.display = 'block';
                        console.error('Login error:', error);
                    }
                });
            });
        </script>
