<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller View Profile</title>
    <link 
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" 
          rel="stylesheet">
    <link 
          rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/bank_teller_view_profile.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>
                    <span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <div class="user-avatar">
                    <img src="../assets/images/profile_bank_teller.jpg" 
                          alt="Bank Teller Profile" />
                </div>
                <div class="user-name">Jovani Avi</div>
            </div>
            
            <div class="nav-menu">
                <a href="bank_teller_dashboard.html" class="nav-item">Dashboard</a>
                <a href="bank_teller_search_account.html" class="nav-item">Search Account</a>
                <a href="bank_teller_history.html" class="nav-item">History</a>
            </div>
            
            <div class="nav-logout">
                <a href="login_teller.html">
                    Log out
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="page-header">
                <span>View Account</span>
            </div>
            
            <div class="account-card">
                <div class="account-avatar">
                    <img src="../assets/images/profile_bank_teller.jpg" 
                        alt="Customer Profile" />
                </div>
                <div class="account-info">
                    <span class="label">First Name</span>
                    <span class="value">John</span>
                    
                    <span class="label">Last Name</span>
                    <span class="value">Doe</span>
                    
                    <span class="label">Email Address</span>
                    <span class="value">johndoe@gmail.com</span>
                    
                    <span class="label">Status</span>
                    <span class="status-active">Active</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
