<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Teller - History</title>
    <link 
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" 
          rel="stylesheet">
    <link 
          rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/src/public/assets/styles/bank_teller_history.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1><span class="stack">Stack</span>
                    <span class="overcash">Overcash</span>
                </h1>
            </div>
            
            <div class="user-profile">
                <a href="bank_teller_view_profile.html">
                    <img src="/src/public/assets/images/profile_bank_teller.jpg"
                          alt="User Avatar" class="user-avatar">
                </a>
                <div class="user-name">Jovani Avi</div>
            </div>
            
            <div class="nav-menu">
                <a href="bank_teller_dashboard.html" 
                      class="nav-item">Dashboard</a>
                <a href="bank_teller_search_account.html"
                      class="nav-item">Search Account</a>
                <div class="nav-selected">History</div>
            </div>

            <div class="nav-logout">
                <a href="login_teller.html">Log out
                <i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
        </div>

        <div class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div id="notification_container" 
                      class="notification-container"></div>
                <div class="top-icons">
                    <div class="top-icon"><i class="fa-regular fa-bell">
                    </i></div>
                    <div class="top-icon"><i class="fa-regular fa-square-plus">
                    </i></div>
                </div>
            </div>

            <div class="history-table-container">
                <div class="history-title">Transaction History</div>
                <div class="table-header">
                    <div class="header-row">
                        <div class="header-cell">Date</div>
                        <div class="header-cell">Type</div>
                        <div class="header-cell">Amount</div>
                        <div class="header-cell">Reference / Details</div>
                        <div class="header-cell">Status</div>
                    </div>
                </div>
                <div id="table-body" class="table-body">
                    <!-- Table rows will be populated by JavaScript -->
                </div>
                
                <div class="pagination-container">
                    <div class="pagination-left">
                        <button id="prev-btn" class="pagination-btn" 
                              onclick="goToPreviousPage()">Previous</button>
                        <div id="page-numbers" class="page-numbers">
                            <!-- Page numbers will be inserted here -->
                        </div>
                        <button id="next-btn" class="pagination-btn" 
                              onclick="goToNextPage()">Next</button>
                    </div>
                    
                    <div class="pagination-right">
                        <span>Per Page</span>
                        <select id="per-page-select" class="per-page-select" 
                              onchange="changeItemsPerPage()">
                            <option value="5">05</option>
                            <option value="10">10</option>
                            <option value="20">20</option>
                        </select>
                        <span id="showing-text">Showing 1 to 05 of 15</span>
                        <button id="go-btn" class="go-btn" 
                              onclick="applyPaginationSettings()">Go</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/src/public/assets/script/teller_history.js"></script>
</body>
</html>
