<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password - StackOvercash</title>
    <link rel="icon" type="image/png" href="/assets/images/soc-logo.png" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        body {
            background: #f3ffe1;
            font-family: 'Montserrat', Arial, sans-serif;
            color: #222;
            margin: 0;
            padding: 0;
        }
        .main-panel {
            background: #111;
            max-width: 420px;
            margin: 60px auto;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            padding: 0 0 24px 0;
            text-align: center;
        }
        .brand-name {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            letter-spacing: -1px;
            padding-top: 28px;
            padding-bottom: 16px;
            margin-top: 32px;
        }
        .brand-name .white { color: #fff; }
        .brand-name .green { color: #b6ff4a; }
        .email-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 32px 28px 24px 28px;
            max-width: 360px;
            margin: 0 auto 18px auto;
            text-align: left;
        }
        .email-card h2 {
            color: #111;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 18px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #222;
        }
        .input-group {
            display: flex;
            align-items: center;
        }
        .input-group input[type="password"],
        .input-group input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #cce5a6;
            border-radius: 6px 0 0 6px;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
            height: 38px;
            box-sizing: border-box;
        }
        .input-group button.toggle-password {
            background: #eaffd0;
            border: 1px solid #cce5a6;
            border-left: none;
            border-radius: 0 6px 6px 0;
            padding: 0 12px;
            cursor: pointer;
            font-size: 1rem;
            color: #222;
            height: 38px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-btn {
            width: 100%;
            background: #a7f535;
            color: #222;
            border: none;
            border-radius: 6px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .reset-btn:hover {
            background: #c6ff7f;
        }
        #reset-message {
            margin-top: 16px;
            font-size: 1rem;
            color: #e74c3c;
            text-align: center;
        }
        .reset-links {
            margin-top: 18px;
            padding-left: 0;
            list-style: none;
            text-align: center;
        }
        .reset-links li {
            display: inline-block;
            margin: 0 10px;
        }
        .reset-links a {
            color: #2d7a2d;
            text-decoration: underline;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="main-panel">
        <div class="brand-name"><span class="white">Stack</span><span class="green">Overcash</span></div>
        <div class="email-card">
            <h2>Reset Your Password</h2>
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <div class="input-group">
                        <input type="password" id="new-password" name="new-password" placeholder="New Password" required />
                        <button type="button" class="toggle-password" data-target="new-password"><i class="fa fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required />
                        <button type="button" class="toggle-password" data-target="confirm-password"><i class="fa fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="reset-btn">Confirm Reset</button>
            </form>
            <div id="reset-message"></div>
            <!-- Links removed for minimalist look -->
        </div>
    </div>
    <script src="/user/js/config.js"></script>
    <script src="/user/js/reset_password.js"></script>
    <script>
    // Password visibility toggle
    document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', function() {
            const target = document.getElementById(this.dataset.target);
            if (target.type === 'password') {
                target.type = 'text';
                this.querySelector('i').classList.remove('fa-eye');
                this.querySelector('i').classList.add('fa-eye-slash');
            } else {
                target.type = 'password';
                this.querySelector('i').classList.remove('fa-eye-slash');
                this.querySelector('i').classList.add('fa-eye');
            }
        });
    });
    </script>
</body>
</html>
