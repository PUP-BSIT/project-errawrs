name: Deploy to EC2

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          # Set up keys from secrets
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/aws_key
          echo "${{ secrets.EC2_SSH_KEY_SIM }}" > ~/.ssh/aws_key_sim
          echo "${{ secrets.EC2_SSH_KEY_IVAN }}" > ~/.ssh/aws_key_ivan
          echo "${{ secrets.EC2_SSH_KEY_GERALD }}" > ~/.ssh/aws_key_gerald
          # Set correct permissions
          chmod 600 ~/.ssh/aws_key ~/.ssh/aws_key_sim ~/.ssh/aws_key_ivan ~/.ssh/aws_key_gerald
          # Add host to known_hosts to avoid interactive prompts
          ssh-keyscan -H ec2-54-206-163-49.ap-southeast-2.compute.amazonaws.com >> ~/.ssh/known_hosts

      - name: Deploy to Production (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          SSH_KEY=~/.ssh/aws_key
          REMOTE_USER=ubuntu
          REMOTE_HOST=ec2-54-206-163-49.ap-southeast-2.compute.amazonaws.com
          DEPLOY_PATH=/var/www/html/project-errawrs
          ENV_BACKUP_PATH=/tmp/errawrs_env_backup_prod

          echo "Starting deployment to production environment on ${REMOTE_HOST}..."

          # Backup .env file if it exists
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "if [ -f ${DEPLOY_PATH}/.env ]; then sudo cp ${DEPLOY_PATH}/.env ${ENV_BACKUP_PATH}/.env.bak; fi"

          # Erase the whole deployment path (including hidden files)
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "sudo rm -rf ${DEPLOY_PATH}/* ${DEPLOY_PATH}/.[^.]*"
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "sudo mkdir -p ${DEPLOY_PATH}"

          # Copy new files from the runner to the deployment path
          echo "Copying files from runner to ${REMOTE_HOST}:${DEPLOY_PATH}/"
          scp -o StrictHostKeyChecking=no -i ${SSH_KEY} -r ./* ${REMOTE_USER}@${REMOTE_HOST}:${DEPLOY_PATH}/
          echo "File copy complete."

          # Restore .env file
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "if [ -f ${ENV_BACKUP_PATH}/.env.bak ]; then sudo mv ${ENV_BACKUP_PATH}/.env.bak ${DEPLOY_PATH}/.env; fi"

          # Set proper permissions for production
          echo "Setting proper permissions..."
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "sudo chown -R www-data:www-data ${DEPLOY_PATH} && sudo chmod 600 ${DEPLOY_PATH}/.env && sudo chmod -R 755 ${DEPLOY_PATH}/public ${DEPLOY_PATH}/src ${DEPLOY_PATH}/vendor && sudo chmod -R 755 ${DEPLOY_PATH}/src/api/user/uploads/"

          # Clear PHP opcache (server cache)
          echo "Clearing PHP opcache..."
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "php -r 'if(function_exists(\'opcache_reset\')){opcache_reset(); echo \"OPcache reset.\\n\";}else{echo \"OPcache not enabled.\\n\";}';"

          # Clean up temporary backup path
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "sudo rm -rf ${ENV_BACKUP_PATH}"
          echo "Cleaned up temporary directories for production."

      - name: Deploy to Development (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          SSH_KEY=~/.ssh/aws_key
          REMOTE_USER=ubuntu
          REMOTE_HOST=ec2-54-206-163-49.ap-southeast-2.compute.amazonaws.com
          DEPLOY_PATH=/var/www/dev/project-errawrs
          ENV_BACKUP_PATH=/tmp/errawrs_env_backup_dev

          echo "Starting deployment to development environment on ${REMOTE_HOST}..."

          # Backup .env file if it exists
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "if [ -f ${DEPLOY_PATH}/.env ]; then sudo mkdir -p ${ENV_BACKUP_PATH} && sudo cp ${DEPLOY_PATH}/.env ${ENV_BACKUP_PATH}/.env.bak; fi"

          # Erase the whole deployment path (including hidden files)
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "sudo rm -rf ${DEPLOY_PATH}/* ${DEPLOY_PATH}/.[^.]*"
          # Ensure directory exists and is owned by ubuntu for scp
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "sudo mkdir -p ${DEPLOY_PATH} && sudo chown -R ${REMOTE_USER}:${REMOTE_USER} ${DEPLOY_PATH}"

          # Copy new files from the runner to the deployment path
          echo "Copying files from runner to ${REMOTE_HOST}:${DEPLOY_PATH}/"
          scp -o StrictHostKeyChecking=no -i ${SSH_KEY} -r ./* ${REMOTE_USER}@${REMOTE_HOST}:${DEPLOY_PATH}/
          echo "File copy complete."

          # Restore .env file
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "if [ -f ${ENV_BACKUP_PATH}/.env.bak ]; then sudo mv ${ENV_BACKUP_PATH}/.env.bak ${DEPLOY_PATH}/.env; fi"

          # Set proper permissions for development
          echo "Setting proper permissions..."
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "sudo chown -R www-data:www-data ${DEPLOY_PATH} && [ -f ${DEPLOY_PATH}/.env ] && sudo chmod 600 ${DEPLOY_PATH}/.env || true && sudo chmod -R 755 ${DEPLOY_PATH}/public ${DEPLOY_PATH}/src ${DEPLOY_PATH}/vendor && sudo mkdir -p ${DEPLOY_PATH}/public/uploads/ && sudo chmod -R 755 ${DEPLOY_PATH}/public/uploads/"

          # Clear PHP opcache (server cache)
          echo "Clearing PHP opcache..."
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "php -r 'if(function_exists(\'opcache_reset\')){opcache_reset(); echo \"OPcache reset.\\n\";}else{echo \"OPcache not enabled.\\n\";}';"

          # Clean up temporary backup path
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "sudo rm -rf ${ENV_BACKUP_PATH}"
          echo "Cleaned up temporary directories for development."

      - name: Verify Deployment
        run: |
          SSH_KEY=~/.ssh/aws_key
          REMOTE_USER=ubuntu
          REMOTE_HOST=ec2-54-206-163-49.ap-southeast-2.compute.amazonaws.com
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            DEPLOY_PATH=/var/www/html/project-errawrs
          else
            DEPLOY_PATH=/var/www/dev/project-errawrs
          fi
          
          echo "Verifying deployment..."
          
          # Check if Composer dependencies are installed
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "cd ${DEPLOY_PATH} && echo 'Checking Composer dependencies...' && ls -la vendor/phpmailer/ && ls -la vendor/vlucas/ && echo '✅ Dependencies verified'"
          
          # Check if .env file exists and has proper permissions
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "cd ${DEPLOY_PATH} && echo 'Checking .env file...' && ls -la .env && echo '✅ .env file verified'"
          
          # Check if uploads directory exists
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "cd ${DEPLOY_PATH} && echo 'Checking uploads directory...' && ls -la src/api/user/uploads/ && echo '✅ Uploads directory verified'"

      - name: Deployment Summary
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "✅ Successfully deployed to PRODUCTION environment"
            echo "🌐 URL: http://ec2-54-206-163-49.ap-southeast-2.compute.amazonaws.com/project-errawrs"
            echo "📧 Email functionality: PHPMailer configured and ready"
            echo "📁 File uploads: Directory structure created and secured"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "✅ Successfully deployed to DEVELOPMENT environment"
            echo "🌐 URL: http://ec2-54-206-163-49.ap-southeast-2.compute.amazonaws.com (dev site)"
            echo "📧 Email functionality: PHPMailer configured and ready"
            echo "📁 File uploads: Directory structure created and secured"
          fi
