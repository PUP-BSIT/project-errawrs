name: Deploy to EC2

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          # Set up keys from secrets
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/aws_key
          echo "${{ secrets.EC2_SSH_KEY_SIM }}" > ~/.ssh/aws_key_sim
          echo "${{ secrets.EC2_SSH_KEY_IVAN }}" > ~/.ssh/aws_key_ivan
          echo "${{ secrets.EC2_SSH_KEY_GERALD }}" > ~/.ssh/aws_key_gerald
          # Set correct permissions
          chmod 600 ~/.ssh/aws_key ~/.ssh/aws_key_sim ~/.ssh/aws_key_ivan ~/.ssh/aws_key_gerald
          # Add host to known_hosts to avoid interactive prompts - Make sure the IP/hostname is correct
          ssh-keyscan -H ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com >> ~/.ssh/known_hosts

      - name: Deploy to Production (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          SSH_KEY=~/.ssh/aws_key
          REMOTE_USER=ubuntu
          REMOTE_HOST=ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com
          DEPLOY_PATH=/var/www/html/project-errawrs
          TMP_PATH=/tmp/errawrs_deploy_prod
          ENV_BACKUP_PATH=/tmp/errawrs_env_backup_prod

          echo "Starting deployment to production environment on ${REMOTE_HOST}..."

          # Ensure temporary paths exist
          ssh -o StrictHostKeyChecking=no -i ${SSH_KEY} ${REMOTE_USER}@${REMOTE_HOST} "mkdir -p ${TMP_PATH} ${ENV_BACKUP_PATH}"

