name: Deploy to EC2

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/aws_key
          echo "${{ secrets.EC2_SSH_KEY_SIM }}" > ~/.ssh/aws_key_sim
          echo "${{ secrets.EC2_SSH_KEY_IVAN }}" > ~/.ssh/aws_key_ivan
          chmod 600 ~/.ssh/aws_key ~/.ssh/aws_key_sim ~/.ssh/aws_key_ivan
          ssh-keyscan -H ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com >> ~/.ssh/known_hosts

      - name: Deploy to Production (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key ubuntu@ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com 'sudo rm -rf /var/www/html/errawrs/project-errawrs/*'
          scp -o StrictHostKeyChecking=no -i ~/.ssh/aws_key -r ./* ubuntu@ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com:/tmp/deploy-prod/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key ubuntu@ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com 'sudo mv /tmp/deploy-prod/* /var/www/html/errawrs/project-errawrs/ && sudo chown -R www-data:www-data /var/www/html/errawrs/project-errawrs && sudo chmod -R 755 /var/www/html/errawrs/project-errawrs'

      - name: Deploy to Development (dev branch)
        if: github.ref == 'refs/heads/dev'
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key ubuntu@ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com 'sudo rm -rf /var/www/dev/*'
          scp -o StrictHostKeyChecking=no -i ~/.ssh/aws_key -r ./* ubuntu@ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com:/tmp/deploy-dev/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key ubuntu@ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com 'sudo mv /tmp/deploy-dev/* /var/www/dev/ && sudo chown -R www-data:www-data /var/www/dev && sudo chmod -R 755 /var/www/dev'

      - name: Deployment Summary
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "✅ Successfully deployed to PRODUCTION environment"
            echo "🌐 URL: http://ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com/errawrs/project-errawrs"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "✅ Successfully deployed to DEVELOPMENT environment"
            echo "🌐 URL: http://ec2-54-206-115-2.ap-southeast-2.compute.amazonaws.com (dev site)"
          fi